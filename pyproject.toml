[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker"
version = "0.2.0"
description = "NeuroTrack AI - per-second system telemetry with on-device learned real-time feedback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.33",   # st.fragment(run_every=...) is used for live refresh
  "psutil>=5.9",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",       # model checkpointing
]

[project.scripts]
tracker = "tracker_cli:main"
neurotrack-train = "train_model:main"

[tool.setuptools]
py-modules = ["tracker", "tracker_cli", "train_model"]

[tool.setuptools.packages.find]
include = ["neurotrack*"]
